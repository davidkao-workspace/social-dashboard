<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 就算放上公開網址,也不要被搜尋引擎收錄(擋不住拿到網址的人,只擋自動索引) -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>社群海巡</title>
<style>
  :root{
    --bg:#f3f4f7; --card:#fff; --ink:#131A22; --mut:#7a869a; --line:#e9ecf2;
    --pri:#F76C5E; --pri2:#FF9900; --pri-soft:#FEF0EE;
    --green:#16a34a; --red:#e5484d; --gray:#b3bccb; --pink:#d6249f;
    --shadow:0 1px 2px rgba(20,40,80,.04),0 8px 24px rgba(20,40,80,.06);
  }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,"PingFang TC","Helvetica Neue",sans-serif; margin:0;
        background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  a{ color:var(--pri); text-decoration:none; }
  .wrap{ max-width:880px; margin:0 auto; padding:30px 20px 60px; }

  header.top{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  header.top img{ width:34px; height:34px; object-fit:contain; }
  header.top h1{ font-size:22px; margin:0; letter-spacing:-.01em; }
  header.top small{ display:block; color:var(--mut); font-size:12px; font-weight:500; }
  .vtag{ display:inline-block; vertical-align:2px; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:20px; letter-spacing:.02em; }
  .vtag.full{ background:var(--pri-soft); color:var(--pri); border:1px solid #f7c9c2; }
  .vtag.share{ background:#eef1f6; color:#5b6472; border:1px solid #dfe4ec; }
  .upd{ margin-left:auto; border:0; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
        color:#fff; background:linear-gradient(135deg,var(--pri),var(--pri2)); box-shadow:0 6px 16px rgba(247,108,94,.28); transition:.15s; white-space:nowrap; }
  .upd:hover{ filter:brightness(1.05); }
  .upd:disabled{ opacity:.6; cursor:default; box-shadow:none; }
  .updated{ color:var(--mut); font-size:12.5px; margin:0 0 20px 46px; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; }
  .pf-btn{ border:1px solid var(--line); background:var(--card); border-radius:20px; padding:7px 15px;
           font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); transition:.15s; }
  .pf-btn.on{ background:var(--pri); border-color:var(--pri); color:#fff; }
  .filters input[type=search]{ flex:1; min-width:170px; border:1px solid var(--line); border-radius:20px;
           padding:8px 15px; font-size:13px; outline:none; background:var(--card); color:var(--ink); }
  .filters input[type=search]:focus{ border-color:var(--pri); box-shadow:0 0 0 3px var(--pri-soft); }

  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); }
  .kpi .lab{ font-size:12px; color:var(--mut); }
  .kpi .num{ font-size:24px; font-weight:800; margin-top:6px; }
  .kpi .num small{ font-size:12px; font-weight:600; color:var(--mut); }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:22px; }
  .panel h2{ margin:0 0 14px; font-size:15px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:7px 0; cursor:pointer; }
  .bar-lab{ width:78px; flex:none; font-size:12.5px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; background:var(--bg); border-radius:6px; height:18px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--pri); border-radius:6px; }
  .bar-row.on .bar-fill{ background:var(--pri2); }
  .bar-val{ width:48px; flex:none; font-size:12px; color:var(--mut); font-weight:700; }

  .feedhead{ display:flex; justify-content:space-between; align-items:center; margin:0 2px 12px; }
  .feedhead h2{ font-size:16px; margin:0; }
  .tbtn{ border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink); }

  .row{ display:flex; gap:13px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gray);
        border-radius:12px; padding:13px 15px; margin-bottom:9px; align-items:flex-start; box-shadow:var(--shadow); }
  .row.sp正{ border-left-color:var(--green);} .row.sp負{ border-left-color:var(--red);} .row.sp中{ border-left-color:var(--gray);}
  .row .mid{ flex:1; min-width:0; }
  .row .head{ font-size:12.5px; color:var(--mut); margin-bottom:5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .row .txt{ font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row .right{ flex:none; text-align:right; min-width:96px; }
  .row .eng{ font-size:18px; font-weight:800; }
  .row .det{ font-size:11.5px; color:var(--mut); margin-top:3px; }
  .pf{ display:inline-block; border-radius:6px; padding:1px 8px; font-size:11px; font-weight:700; color:#fff; }
  .pf-instagram{ background:var(--pink);} .pf-threads{ background:#0b0b0f;} .pf-reddit{ background:#FF4500;} .pf-x{ background:#0b0b0f;}
  .pf-ptt{ background:#2d6cdf;} .pf-mobile01{ background:#e2662c;}
  details.reply{ margin-top:9px; }
  details.reply summary{ cursor:pointer; font-size:12.5px; color:var(--pri); font-weight:700; list-style:none; }
  details.reply summary::-webkit-details-marker{ display:none; }
  .reply .box{ margin-top:8px; }
  .reply textarea{ width:100%; min-height:62px; padding:9px; border:1px solid var(--line);
    border-radius:9px; font-size:13px; resize:vertical; font-family:inherit; box-sizing:border-box; }
  .reply .rbar{ display:flex; align-items:center; gap:9px; margin-top:7px; flex-wrap:wrap; }
  .reply .rbtn{ border:0; border-radius:8px; padding:6px 13px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .reply .gen{ background:var(--pri-soft); color:var(--pri); }
  .reply .save{ background:var(--pri); color:#fff; }
  .reply .rmsg{ font-size:12px; }
  .reply .racctwrap{ font-size:12px; color:var(--mut); display:inline-flex; align-items:center; gap:5px; }
  .reply .racct{ font:inherit; font-size:12px; color:var(--ink); background:#fff; padding:5px 8px;
    border:1px solid var(--line); border-radius:8px; max-width:230px; cursor:pointer; }
  .reply .rwarn{ font-size:12px; color:#b45309; }
  .reply .rnote{ margin-top:6px; font-size:11.5px; color:var(--mut); }
  .sent{ display:inline-block; border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; color:#fff; }
  .s正{ background:var(--green);} .s負{ background:var(--red);} .s中{ background:var(--gray);}
  .empty{ color:var(--mut); font-size:13px; padding:10px 2px; }
  footer{ margin-top:26px; color:var(--mut); font-size:12px; line-height:1.7; text-align:center; }
  footer a{ color:var(--pri); font-weight:700; }
  @media(max-width:560px){ .kpis{grid-template-columns:1fr;} .row .right{min-width:80px;} }
</style>
</head>

      const p=new URLSearchParams({platform:ta.dataset.pf,pk:ta.dataset.pk,q:ta.dataset.q,sentiment:ta.dataset.sent});
      fetch("/reply/gen?"+p).then(r=>r.json()).then(x=>{ ta.value=x.text||""; b.disabled=false; })
        .catch(()=>{ b.disabled=false; msg.textContent="需用「啟動儀表板.command」開啟才能生成"; msg.style.color="#e5484d"; });
    };
    d.querySelector(".save").onclick=()=>{
      fetch("/reply/save",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:new URLSearchParams({platform:ta.dataset.pf,pk:ta.dataset.pk,q:ta.dataset.q,
          text:ta.value,account:sel?sel.value:""}).toString()})
        .then(r=>r.json()).then(x=>{ msg.textContent=x.msg; msg.style.color="#16a34a"; setTimeout(()=>msg.textContent="",5000); })
        .catch(()=>{ msg.textContent="需用「啟動儀表板.command」開啟才能儲存"; msg.style.color="#e5484d"; });
    };
  });
}

function filtered(){
  return DATA.posts.filter(r=>{
    if(st.platform!=="all" && r.platform!==st.platform) return false;
    if(st.q && r.query!==st.q) return false;
    if(st.search){ const s=st.search.toLowerCase();
      if(!((r.caption||"").toLowerCase().includes(s) || (r.username||"").toLowerCase().includes(s))) return false; }
    return true;
  });
}

function render(){
  document.querySelectorAll(".pf-btn").forEach(b=>b.classList.toggle("on", b.dataset.pf===st.platform));
  const rows=filtered();
  const total=rows.length;
  const sumE=rows.reduce((a,r)=>a+r.engagement,0);
  const pos=rows.filter(r=>(r.sentiment||"中")==="正").length;
  const posPct=total?Math.round(100*pos/total):0;

  document.getElementById("updated").innerHTML=`📅 資料更新於 <b>${esc(DATA.meta.generated_at)}</b> · 共收錄 ${cfmt(DATA.meta.total)} 篇`;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="lab">📝 貼文數</div><div class="num">${cfmt(total)}<small> 篇</small></div></div>
    <div class="kpi"><div class="lab">🔥 總互動數</div><div class="num">${cfmt(sumE)}</div></div>
    <div class="kpi"><div class="lab">😊 正向佔比</div><div class="num">${posPct}<small>%</small></div></div>`;

  // 熱門議題長條
  const te={}; rows.forEach(r=>te[r.query]=(te[r.query]||0)+r.engagement);
  const topics=Object.entries(te).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  const bars=document.getElementById("bars");
  if(topics.length){ const mx=topics[0].value||1;
    bars.innerHTML=topics.slice(0,8).map(d=>`<div class="bar-row ${d.label===st.q?'on':''}" data-topic="${esc(d.label)}">
      <div class="bar-lab" title="${esc(d.label)}">${esc(d.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,d.value/mx*100)}%"></div></div>
      <div class="bar-val">${kfmt(d.value)}</div></div>`).join("");
    bars.querySelectorAll(".bar-row").forEach(n=>n.onclick=()=>{ st.q = st.q===n.dataset.topic?"":n.dataset.topic; render(); });
  } else bars.innerHTML='<div class="empty">尚無資料</div>';

  // 貼文清單
  document.getElementById("feedTitle").textContent = st.q ? `「${st.q}」熱門貼文` : "熱門貼文";
  const items=[...rows].sort((a,b)=>b.engagement-a.engagement).slice(0,30);
  const feed=document.getElementById("feed");
  feed.innerHTML = items.length ? items.map(r=>{
    const s=r.sentiment||"中"; const dt=fdate(r);
    return `<div class="row sp${s}"><div class="mid">
      <div class="head"><span class="pf pf-${r.platform}">${PLABEL[r.platform]||r.platform}</span>
        <span class="sent s${s}">${s}</span> @${esc(r.username||"—")} · ${esc(r.query)}${dt?` · ${dt}`:""}</div>
      <div class="txt">${esc(r.caption)}</div>${FULL?replyBlock(r):""}</div>
      <div class="right"><div class="eng">🔥 ${cfmt(r.engagement)}</div>
        <div class="det">❤️ ${cfmt(r.like_count)} · 💬 ${cfmt(r.comment_count)}</div>
        <div class="det"><a href="${esc(r.permalink)}" target="_blank" rel="noopener">看原文 ↗</a></div></div>
    </div>`; }).join("") : '<div class="empty">此條件下沒有資料。</div>';
  if(FULL) bindReply();

  document.getElementById("foot").innerHTML=`社群海巡 · by <b style="color:var(--pri)">Upsell 優曝數位</b> · 資料更新於 ${esc(DATA.meta.generated_at)}<br>有問題或想合作?來信 <a href="mailto:davidkao@upsell-ecomm.com">davidkao@upsell-ecomm.com</a>`;
}

function exportCsv(){
  const rows=filtered().sort((a,b)=>b.engagement-a.engagement);
  const head=["平台","議題","作者","情緒","日期","讚","留言","互動","內容","連結"];
  const q=v=>'"'+(""+(v==null?"":v)).replace(/"/g,'""')+'"';
  const dcsv=r=>{ const raw=r.taken_at||r.scraped_at||""; return raw?(""+raw).slice(0,10):""; };
  const lines=[head.map(q).join(",")];
  rows.forEach(r=>lines.push([r.platform,r.query,r.username,r.sentiment,dcsv(r),r.like_count,r.comment_count,r.engagement,r.caption,r.permalink].map(q).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="social-monitor.csv"; a.click(); URL.revokeObjectURL(a.href);
}

document.querySelectorAll(".pf-btn").forEach(b=>b.onclick=()=>{ st.platform=b.dataset.pf; render(); });
document.getElementById("search").oninput=e=>{ st.search=e.target.value.trim(); render(); };
document.getElementById("exportBtn").onclick=exportCsv;

// 表頭版本標示:完整版(本機、含回覆草稿) / 分享版(對外)
const vtag=document.getElementById("vtag");
vtag.textContent = FULL ? "完整版" : "分享版";
vtag.className = "vtag " + (FULL ? "full" : "share");
vtag.title = FULL ? "本機使用:含回覆草稿與更新按鈕" : "對外分享:純檢視,不含回覆功能";

// 更新按鈕:只在本機伺服器模式(啟動儀表板.command)出現;檔案直接開(分享版)時隱藏
const updBtn=document.getElementById("updBtn");
if(location.protocol.startsWith("http")){
  updBtn.style.display="inline-flex";
  updBtn.onclick=()=>{
    if(!confirm("要重新抓取最新社群資料嗎?\n會自動開啟瀏覽器抓取,約需幾分鐘,完成後自動重整。")) return;
    updBtn.disabled=true; updBtn.textContent="⏳ 更新中…";
    const reset=(msg)=>{ updBtn.disabled=false; updBtn.textContent="🔄 更新資料"; if(msg) alert(msg); };
    fetch("/update",{method:"POST"}).then(r=>r.json()).then(d=>{
      if(!d.ok){ reset(d.msg||"目前無法啟動更新"); return; }
      const t=setInterval(()=>{ fetch("/update_status").then(r=>r.json()).then(s=>{
        if(s.error){ clearInterval(t); reset("更新失敗:"+s.error); }
        else if(s.done){ clearInterval(t); updBtn.textContent="✅ 完成,重整中…"; setTimeout(()=>location.reload(),1200); }
      }).catch(()=>{}); }, 3000);
    }).catch(()=>reset("此頁非伺服器模式,無法更新。\n請改用「啟動儀表板.command」開啟。"));
  };
}
render();
</script>
